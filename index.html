<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fazekas Milán</title>
    <script src="index.js" type="module"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header><h1>Szamológép</h1></header>
      <article>
        <div class="eredmeny">
            <input type="text" id="bevitel">
        </div>
        <div class="gombok">
          <section id="elsooszlop">
            <button id="7" class="szam">7</button>
            <button id="4" class="szam">4</button>
            <button id="1" class="szam">1</button>
            <button id="C" class="torles">C</button>
          </section>
          <section id="masodikoszlop">
            <button id="8" class="szam">8</button>
            <button id="5" class="szam">5</button>
            <button id="2" class="szam">2</button>
            <button id="0" class="szam">0</button>
          </section>
          <section id="harmadikoszlop">
            <button id="9" class="szam">9</button>
            <button id="6" class="szam">6</button>
            <button id="3" class="szam">3</button>
            <button id="=" class="egyenlo">=</button>
          </section>
          <section id="negygedikoszlop">
            <button id="/" class="muvelet">/</button>
            <button id="*" class="muvelet">*</button>
            <button id="-" class="muvelet">-</button>
            <button id="+" class="muvelet">+</button>
          </section>
        </div>
      </article>
    </main>
    <footer></footer>
  </body>
</html>
